<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="cp-a1">
<title id="cp-a1">Cut Protocol — the landing</title>
<!-- THE WALK. One open monoline, outlined as explicit geometry: butt caps, miter joins,
     zero radius, no curves. Centreline M 42,52 H 122 V 124 H 202 V 196. Stroke 24.
     Treads 80 = 80. Risers 72 = 72. Visible counters 48 = 48. Measured, not eyeballed.
     Tread:riser 1.67 — real stair proportion, so it reads as a staircase, not a graph. -->
<path fill="#23201D" d="M42 40H134V112H214V196H190V136H110V64H42Z"/>
<!-- THE FLOOR. 224 x 32: thicker than the 24 walk, wider than the 172 staircase,
     overhanging 26 on BOTH sides. The walk stops at y196 — twelve units, exactly one
     half-stroke, INSIDE the rule. It lands. It does not hover, and it does not cross. -->
<path fill="#23201D" d="M16 184H240V216H16Z"/>
</svg>
