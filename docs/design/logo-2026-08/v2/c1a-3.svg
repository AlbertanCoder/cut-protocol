<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="cp-a3">
<title id="cp-a3">Cut Protocol — the landing, single riser</title>
<!-- SMALL-SIZE MASTER (<=32px). Different art, not c1a-1 reduced: one tread, one drop,
     one rule. Same sentence, fewest parts. Centreline M 48,64 H 192 V 176. Stroke 32.
     Every edge is a multiple of 16, so at 16px this rasterises with ZERO anti-aliasing:
     stroke exactly 2px, counter 5px, floor 3px. Tread:riser 1.80, stair proportion. -->
<path fill="#23201D" d="M48 48H208V176H176V80H48Z"/>
<!-- THE FLOOR. 224 x 48, overhang 32 both sides, 1.5x the walk's weight.
     Shares c1a-1's x16/x240 rule edges so large and small masters sit in one frame. -->
<path fill="#23201D" d="M16 160H240V208H16Z"/>
</svg>
